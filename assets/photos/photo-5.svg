    <line x1="470" y1="470" x2="470" y2="560"/>
    <line x1="600" y1="430" x2="600" y2="530"/>
    <line x1="730" y1="470" x2="730" y2="560"/>
  </g>
  <g fill="none" stroke="#8a6a2d" stroke-width="6" stroke-linejoin="round">
    <path d="M442 560 h56 l10 96 h-76 Z"/>
    <path d="M572 530 h56 l10 110 h-76 Z"/>
    <path d="M702 560 h56 l10 96 h-76 Z"/>
  </g>
