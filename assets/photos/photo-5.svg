      <stop offset="0" stop-color="#f6eeda"/>
      <stop offset="1" stop-color="#eadcb9"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c98f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c98d5f" stop-opacity="0.12"/>
